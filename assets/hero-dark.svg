<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" role="img" aria-label="Ridlo Abelian — Founder-Builder of Waqf x AI Infrastructure">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35" />
    </pattern>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="286" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="1196" height="286" fill="url(#bgGrad)" />
    <rect x="2" y="2" width="1196" height="286" fill="url(#archGrid)" />
    <circle cx="170" cy="40" r="340" fill="url(#emeraldGlow)" />
    <circle cx="1060" cy="245" r="300" fill="url(#goldGlow)" />
    <rect x="48" y="2" width="1104" height="3" rx="1.5" fill="url(#accentBar)" />

    <!-- Right-side Islamic 8-pointed geometric star (Rub el Hizb), confined strictly to x > 915 -->
    <g>
      <circle cx="1045" cy="145" r="112" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="4 6" />
      <rect x="975" y="75" width="140" height="140" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.26" />
      <rect x="975" y="75" width="140" height="140" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.22" transform="rotate(45 1045 145)" />
      <circle cx="1045" cy="145" r="44" fill="none" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.28" />
      <rect x="1021" y="121" width="48" height="48" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.28" transform="rotate(45 1045 145)" />
      <circle cx="1045" cy="145" r="18" fill="#10b981" fill-opacity="0.16" />
      <circle cx="1045" cy="145" r="7" fill="#34d399" fill-opacity="0.88" />
    </g>
  </g>

  <rect x="2" y="2" width="1196" height="286" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Status pill -->
  <rect x="56" y="34" width="476" height="28" rx="14" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-width="1" stroke-opacity="0.45" />
  <circle cx="74" cy="48" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text x="88" y="52" fill="#6ee7b7" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" letter-spacing="1.1">BANDUNG, ID  ·  SERVERLESS &amp; AGENT-OPERATED  ·  HALAL-FIRST</text>

  <!-- Main identity headline & subtitle -->
  <text x="56" y="122" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">Ridlo Abelian</text>
  <text x="56" y="162" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19.5" font-weight="500">Founder-Builder of <tspan fill="#34d399" font-weight="700">Waqf × AI Infrastructure</tspan>, Sharia ERP &amp; Autonomous Systems</text>

  <!-- Role chips -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="56" y="204" width="200" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1" stroke-opacity="0.45" />
    <text x="156" y="228" text-anchor="middle" fill="#e2e8f0">⚡ Founder · SAIF (OPC)</text>

    <rect x="268" y="204" width="212" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1" stroke-opacity="0.45" />
    <text x="374" y="228" text-anchor="middle" fill="#e2e8f0">🕌 CEO · Amal Produktif</text>

    <rect x="492" y="204" width="222" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
    <text x="603" y="228" text-anchor="middle" fill="#e2e8f0">🏛️ Innovation · ANI &amp; FWP</text>

    <rect x="726" y="204" width="184" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="818" y="228" text-anchor="middle" fill="#e2e8f0">🦀 Rust · Edge · Odoo 20</text>
  </g>
</svg>
