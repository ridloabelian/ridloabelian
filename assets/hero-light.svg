<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" role="img" aria-label="Ridlo Abelian — Founder-Builder of Waqf x AI Infrastructure">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <linearGradient id="accentBarLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="emeraldGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <pattern id="archGridLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.65" />
    </pattern>
    <clipPath id="cardClipLight">
      <rect x="2" y="2" width="1196" height="286" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClipLight)">
    <rect x="2" y="2" width="1196" height="286" fill="url(#bgGradLight)" />
    <rect x="2" y="2" width="1196" height="286" fill="url(#archGridLight)" />
    <circle cx="170" cy="40" r="340" fill="url(#emeraldGlowLight)" />
    <circle cx="1060" cy="245" r="300" fill="url(#goldGlowLight)" />
    <rect x="48" y="2" width="1104" height="3" rx="1.5" fill="url(#accentBarLight)" />

    <!-- Right-side Islamic 8-pointed geometric star (Rub el Hizb), confined strictly to x > 915 -->
    <g>
      <circle cx="1045" cy="145" r="112" fill="none" stroke="#059669" stroke-width="1" stroke-opacity="0.16" stroke-dasharray="4 6" />
      <rect x="975" y="75" width="140" height="140" rx="4" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.24" />
      <rect x="975" y="75" width="140" height="140" rx="4" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.22" transform="rotate(45 1045 145)" />
      <circle cx="1045" cy="145" r="44" fill="none" stroke="#059669" stroke-width="1.2" stroke-opacity="0.26" />
      <rect x="1021" y="121" width="48" height="48" rx="3" fill="none" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.28" transform="rotate(45 1045 145)" />
      <circle cx="1045" cy="145" r="18" fill="#10b981" fill-opacity="0.16" />
      <circle cx="1045" cy="145" r="7" fill="#059669" fill-opacity="0.9" />
    </g>
  </g>

  <rect x="2" y="2" width="1196" height="286" rx="20" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Status pill -->
  <rect x="56" y="34" width="476" height="28" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" />
  <circle cx="74" cy="48" r="4.5" fill="#059669">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text x="88" y="52" fill="#065f46" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600" letter-spacing="1.1">BANDUNG, ID  ·  SERVERLESS &amp; AGENT-OPERATED  ·  HALAL-FIRST</text>

  <!-- Main identity headline & subtitle -->
  <text x="56" y="122" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">Ridlo Abelian</text>
  <text x="56" y="162" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19.5" font-weight="500">Founder-Builder of <tspan fill="#047857" font-weight="700">Waqf × AI Infrastructure</tspan>, Sharia ERP &amp; Autonomous Systems</text>

  <!-- Role chips -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="56" y="204" width="200" height="38" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" />
    <text x="156" y="228" text-anchor="middle" fill="#0f172a">⚡ Founder · SAIF (OPC)</text>

    <rect x="268" y="204" width="212" height="38" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" />
    <text x="374" y="228" text-anchor="middle" fill="#0f172a">🕌 CEO · Amal Produktif</text>

    <rect x="492" y="204" width="222" height="38" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.2" />
    <text x="603" y="228" text-anchor="middle" fill="#0f172a">🏛️ Innovation · ANI &amp; FWP</text>

    <rect x="726" y="204" width="184" height="38" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2" />
    <text x="818" y="228" text-anchor="middle" fill="#0f172a">🦀 Rust · Edge · Odoo 20</text>
  </g>
</svg>
