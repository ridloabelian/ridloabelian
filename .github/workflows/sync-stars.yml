name: Sync curated star lists

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: sync-stars
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      STAR_LISTS_PAT: ${{ secrets.STAR_LISTS_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Categorize newly starred repositories (if STAR_LISTS_PAT is configured)
        if: env.STAR_LISTS_PAT != ''
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_LISTS_PAT }}
        run: python3 .github/scripts/categorize_stars.py --apply
      - name: Sync star list counts
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_LISTS_PAT || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_stars.py
      - name: Commit and push updates
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md AGENTS.md
            git commit -m "chore(stars): auto-sync curated star list counts [skip ci]"
            git push
          fi
